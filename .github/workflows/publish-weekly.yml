name: Publish DieNasty weekly recap

on:
  push:
    branches: [main]
    paths:
      - 'generate_weekly.py'
      - 'ai_narratives.py'
  schedule:
    - cron: '0 8 * * 2'
      timezone: 'America/Chicago'
    - cron: '0 11 * * 2'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dienasty-weekly-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generator syntax
        run: python -m py_compile generate_weekly.py ai_narratives.py
      - name: Generate report from finalized Sleeper scores
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIENASTY_AI_MODEL: gpt-6.1-sol
        run: python generate_weekly.py
      - name: Validate generated report quality
        run: python validate_report.py
      - name: Publish updated website if content changed
        run: |
          git add index.html week-5.html data/awardz/ data/narratives/
          if git diff --cached --quiet; then
            echo "No content change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest finalized DieNasty weekly recap"
          git push
