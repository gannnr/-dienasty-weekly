name: Publish DieNasty weekly recap

on:
  push:
    branches: [main]
    paths: ['data/editorial-test.txt']
  schedule:
    # GitHub Actions cron uses UTC; timezone keys are unsupported.
    # Tuesday: 08:00/11:00 CST, 09:00/12:00 CDT.
    - cron: '0 14 * * 2'
    - cron: '0 17 * * 2'
    # Wednesday recovery if Tuesday was delayed or data was incomplete.
    - cron: '0 14 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dienasty-weekly-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Sync latest main before generating
        run: git pull --ff-only origin main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generator syntax
        run: python -m py_compile generate_weekly.py ai_narratives.py build_nfl_reality.py
      - name: Generate report from finalized Sleeper scores
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIENASTY_AI_MODEL: gpt-5-mini
          REGENERATE_AI: '1'
        run: python generate_weekly.py
      - name: Validate generated report quality
        run: python validate_report.py
      - name: Publish updated website if content changed
        run: |
          mkdir -p data/narratives
          git add index.html week-5.html data/awardz/ data/narratives/ data/nfl_week_2026_*.json
          if git diff --cached --quiet; then
            echo "No content change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish latest finalized DieNasty weekly recap"
          # Files are generated from the latest checkout. Fail cleanly on a race;
          # never leave an unresolved rebase and retry it.
          if ! git push origin HEAD:main; then
            echo "::error::Concurrent update detected. Re-run the workflow from fresh main."
            exit 1
          fi
